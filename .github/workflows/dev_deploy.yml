name: Trading dev CI/CD

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make application.yml from base64
        run: |
          mkdir -p ./src/main/resources
          echo "$APPLICATION_YML_BASE64" | base64 -d > ./src/main/resources/application.yml
        env:
          APPLICATION_YML_BASE64: ${{ secrets.APPLICATION_YML_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build -x test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-server
          path: build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: trading-server
          path: build/libs/

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APPLICATION_YML_BASE64: ${{ secrets.APPLICATION_YML_BASE64 }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          # 디코딩된 yml 생성
          echo "$APPLICATION_YML_BASE64" | base64 -d > application.yml

          # jar 파일 찾기
          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)

          # 파일 전송
          scp -i private_key.pem -o StrictHostKeyChecking=no "$jar_file" $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/trading-server.jar
          scp -i private_key.pem -o StrictHostKeyChecking=no application.yml $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/application.yml

          # 서버 재시작
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "
            pgrep java | xargs -r kill -15
            sleep 10
            nohup java -Dspring.config.location=file:/home/ubuntu/application.yml \
              -jar /home/ubuntu/trading-server.jar \
              > app.log 2>&1 &
          "

          rm -f private_key.pem
